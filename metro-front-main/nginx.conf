server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressao (deixa o carregamento mais leve)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache dos assets com hash no nome
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota cai no index.html (react-router cuida do resto)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
