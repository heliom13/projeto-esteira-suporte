# Esteira Suporte — sistema completo em um comando.
# Sobe: banco (Postgres) + backend (Spring) + frontend (React/Nginx).
#
# Como usar:
#   1) copie .env.example para .env e preencha os valores
#   2) docker compose up -d --build
#   3) abra http://localhost:3000
#
# Para parar:   docker compose down
# Com os dados: os dados do Postgres ficam no volume "pgdata" e persistem.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./metro-api-main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WHATSAPP_QUEUE_TOKEN: ${WHATSAPP_QUEUE_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS}
      APP_FRONT_URL: ${APP_FRONT_URL}
      TOKEN_MESSAGE: ${TOKEN_MESSAGE}
      H2_CONSOLE: "false"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./metro-front-main
      args:
        # Endereco do backend acessivel PELO NAVEGADOR (injetado no build do React)
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
